{% extends "base.html" %}
{% block title %}Crear cuenta · QuickFood{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-3">Crear cuenta</h1>
      {% if errors %}
        <div class="alert alert-danger" role="alert">
          <ul class="mb-0">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
        </div>
      {% endif %}
      <form method="post" action="{{ url_for('auth.register') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="name">Nombre</label>
          <input class="form-control" id="name" name="name" value="{{ form.get('name', '') }}" required maxlength="80" autocomplete="name">
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-control" type="email" id="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email">
        </div>
        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="confirm">Confirmar contraseña</label>
            <input class="form-control" type="password" id="confirm" name="confirm" required minlength="8" autocomplete="new-password">
          </div>
        </div>
        <button class="btn btn-primary qf-btn w-100" type="submit">Crear cuenta</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
