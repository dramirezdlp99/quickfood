{% extends "base.html" %}
{% block title %}Ingresar · QuickFood{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-3">Ingresar</h1>
      {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('auth.login') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-control" type="email" id="email" name="email" value="{{ email }}" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary qf-btn w-100" type="submit">Ingresar</button>
      </form>
      <p class="small text-center mt-3 mb-0">¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Créala aquí</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
